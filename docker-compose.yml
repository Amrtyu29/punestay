services:
  db:
    image: postgis/postgis:16-3.4
    container_name: punestay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-punestay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-punestay}
      POSTGRES_DB: ${POSTGRES_DB:-punestay}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 on the host: a local PostgreSQL already uses 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Every .sql file here runs once, in name order, when the volume is first created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-punestay} -d ${POSTGRES_DB:-punestay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Routing engine. Needs data/osrm/pune.osrm* built first (scripts/build_osrm.ps1).
  # Start with:  docker compose --profile routing up -d
  osrm:
    image: osrm/osrm-backend:latest
    container_name: punestay_osrm
    restart: unless-stopped
    profiles: ["routing"]
    command: osrm-routed --algorithm mld --max-table-size 2000 /data/pune.osrm
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./data/osrm:/data:ro

  # FastAPI backend. For development run it on the host instead (see README) so --reload works.
  # Start in Docker with:  docker compose --profile api up -d
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: punestay_api
    restart: unless-stopped
    profiles: ["api"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-punestay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-punestay}
      POSTGRES_DB: ${POSTGRES_DB:-punestay}
      OSRM_URL: http://osrm:5000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
